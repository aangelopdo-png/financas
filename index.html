    ${mudancas.length ? `<h4>O que mais mudou em relação a ${mesCurto(ant)}</h4><ul class="rel-lista">${mudancas.map((x) => `<li><span class="dot" style="background:${x.cat.cor}"></span>${esc(x.cat.nome)}: ${R$(x.ant)} → <strong>${R$(x.total)}</strong> ${varTxt(x.total, x.ant)}</li>`).join("")}</ul>` : ""}
    <h4>Terceiros a receber <small>compras no seu cartão</small></h4>
    ${terceiros.length ? `<table><thead><tr><th>Quem</th><th class="num">Este mês</th><th class="num">Recebido</th><th class="num">Deve no total</th></tr></thead><tbody>
      ${terceiros.map((x) => `<tr><td>${esc(x.nome)}</td><td class="num">${R$(x.mes)}</td><td class="num">${R$(x.rec)}</td><td class="num ${x.pend > 0.004 ? "neg" : "pos"}">${x.pend > 0.004 ? R$(x.pend) : "em dia"}</td></tr>`).join("")}
      <tr class="total"><td>Total</td><td class="num">${R$(soma(terceiros, (x) => x.mes))}</td><td class="num">${R$(soma(terceiros, (x) => x.rec))}</td><td class="num">${R$(soma(terceiros, (x) => x.pend))}</td></tr></tbody></table>` : `<p class="pequeno">Ninguém devendo.</p>`}
    <div class="rel-rodape">Finanças Angelo · dados guardados só neste aparelho · ${agora.toLocaleDateString("pt-BR")}</div>
  </div>`.replace(/<table>/g, `<div class="tbl"><table>`).replace(/<\/table>/g, `</table></div>`);
}
function abrirRelatorio() {
  const html = htmlRelatorio(mesAtual);
  $("#relPrint").innerHTML = html;
  const form = abrir(`${html}
    <p class="pequeno" style="margin:10px 0 0">No iPhone: "Imprimir / salvar PDF" abre a tela de impressão; ali, toque em Compartilhar para mandar o PDF por WhatsApp ou guardar em Arquivos. No PC, escolha "Salvar como PDF" na impressora.</p>
    <div class="rodape-form"><button class="btn" value="cancelar" formnovalidate>Fechar</button>${navigator.share && !window.FIN_ARTIFACT ? `<button type="button" class="btn" data-rel="compartilhar">Compartilhar arquivo</button>` : ""}<button type="button" class="btn primario" data-rel="imprimir">Imprimir / salvar PDF</button></div>`, () => {});
  $("#dlg").classList.add("largo"); $("#dlg").scrollTop = 0; // o foco cai no 1º botão (no fim) e rolava a janela
  $("[data-rel=imprimir]", form).onclick = () => window.print();
  const bc = $("[data-rel=compartilhar]", form); if (bc) bc.onclick = () => compartilharRelatorio(html);
}
async function compartilharRelatorio(html) {
  const css = (document.querySelector("style") || {}).textContent || "";
  const doc = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relatório ${mesLongo(mesAtual)}</title><style>${css}\nbody{padding:16px;background:#fff;color:#000}</style></head><body><div id="relPrint" style="display:block">${html}</div></body></html>`;
  const nome = `relatorio-${mesAtual}.html`, file = new File([doc], nome, { type: "text/html" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: `Relatório ${mesLongo(mesAtual)}` }); return; } } catch (e) { if (e.name === "AbortError") return; }
  const u = URL.createObjectURL(file); const a = document.createElement("a"); a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}

// ============ eventos ============
function ligarEventos() {
  const main = $("#main");
  main.onclick = async (e) => {
    const el = e.target.closest("[data-acao]"); if (!el) return;
    e.preventDefault(); e.stopPropagation();
    const a = el.dataset.acao, id = el.dataset.id;
    if (a === "novo") formLancamento(novoLancamento(el.dataset.tipo));
    else if (a === "editar") formLancamento(D.lancamentos.find((l) => l.id === id));
    else if (a === "pagar") formPagar(conta(id), Number(el.dataset.total));
    else if (a === "pagarItem") { const l = D.lancamentos.find((x) => x.id === id); l.pagos ||= {}; if (l.pagos[mesAtual]) delete l.pagos[mesAtual]; else l.pagos[mesAtual] = new Date().toISOString().slice(0, 10); mudou(); }
    else if (a === "desfazerPago") { D.pagamentos = D.pagamentos.filter((p) => !(p.mes === mesAtual && p.contaId === id)); mudou(); }
    else if (a === "saldo") formSaldo();
    else if (a === "verConta") { aba = "lancamentos"; filtro = { ...filtro, conta: id, soMes: true, soRevisar: false }; render(); }
    else if (a === "toggleRecebido") { const l = D.lancamentos.find((x) => x.id === id); l.recebidos ||= {}; if (l.recebidos[mesAtual]) delete l.recebidos[mesAtual]; else l.recebidos[mesAtual] = new Date().toISOString().slice(0, 10); mudou(); }
    else if (a === "receberTudo") { for (const x of itensDoMes(mesAtual, "despesa")) if (x.l.terceiro === el.dataset.nome) { x.l.recebidos ||= {}; x.l.recebidos[mesAtual] = new Date().toISOString().slice(0, 10); } mudou(); }
    else if (a === "verTerceiro") { aba = "lancamentos"; filtro = { ...filtro, soTerceiros: true, terceiro: el.dataset.nome, conta: "", soMes: false, soRevisar: false }; render(); }
    else if (a === "irRevisar") { aba = "lancamentos"; filtro = { ...filtro, soRevisar: true, conta: "" }; render(); }
    else if (a === "verPessoa") { aba = "apagar"; fPag = { ...fPag, pessoa: el.dataset.nome || "" }; if (el.dataset.nome) PAG_ABERTOS.add("p:" + el.dataset.nome); render(); window.scrollTo(0, 0); }
    else if (a === "pagLimpar") { fPag = { conta: "", cat: "", pessoa: "", nat: "", quinz: "", sit: "", texto: "", terc: "" }; render(); }
    else if (a === "pagAbrir") { if (el.dataset.v === "1") main.querySelectorAll("details[data-k]").forEach((d) => PAG_ABERTOS.add(d.dataset.k)); else PAG_ABERTOS.clear(); render(); }
    else if (a === "irOrcamento") { aba = "config"; render(); setTimeout(() => $("#orcamento")?.scrollIntoView({ behavior: "smooth" }), 50); }
    else if (a === "projCartao") { PROJ_CARTAO = id; render(); }
    else if (a === "irMes") { mesAtual = el.dataset.mes; aba = "resumo"; render(); }
    else if (a === "novaConta") formConta();
    else if (a === "editarConta") formConta(conta(id));
    else if (a === "novoInv") formInvestimento();
    else if (a === "editarInv") formInvestimento(D.investimentos.find((i) => i.id === id));
    else if (a === "addPessoa") { const n = await perguntar("Nome da pessoa:"); if (n && !D.pessoas.includes(n.trim())) { D.pessoas.push(n.trim()); mudou(); } }
    else if (a === "delPessoa") { const n = el.dataset.nome; if (D.lancamentos.some((l) => l.pessoa === n)) return avisar("Há lançamentos com essa pessoa. Reatribua antes."); if (await confirmar(`Remover ${n}?`)) { D.pessoas = D.pessoas.filter((p) => p !== n); mudou(); } }
    else if (a === "addCat") formCategoria();
    else if (a === "editCat") formCategoria(categoria(id));
    else if (a === "delCat") { if (D.lancamentos.some((l) => l.categoriaId === id)) return avisar("Há lançamentos nessa categoria. Reclassifique antes."); D.categorias = D.categorias.filter((c) => c.id !== id); delete D.orcamentos[id]; mudou(); }
    else if (a === "exportar") exportar();
    else if (a === "copiarCopia") copiarCopia();
    else if (a === "verificarAtualizacao") verificarAtualizacao(true);
    else if (a === "ativarBadge") ativarBadge();
    else if (a === "colarCopia") colarCopia();
    else if (a === "compartilhar") compartilhar();
    else if (a === "rodarAgente") { ALERTAS = null; render(); }
    else if (a === "limparRevisar") { D.lancamentos.forEach((l) => (l.revisar = false)); mudou(); }
    else if (a === "relatorio") abrirRelatorio();
    else if (a === "colarComprovante") colarComprovante();
    else if (a === "conferiCredito") { D.conferenciaCredito[hojeMes()] = new Date().toISOString().slice(0, 10); mudou(); avisar("Conferência do mês registrada. Volta a lembrar no mês que vem."); }
    else if (a === "importarExtrato") { if (!D.contas.length) return avisar("Cadastre um cartão ou conta antes de importar."); $("#arqExtrato").click(); }
    else if (a === "apagarTudo") { if (await confirmar("Apagar TODOS os dados deste aparelho? Baixe uma cópia antes.") && await confirmar("Tem certeza? Não dá para desfazer.")) { localStorage.removeItem(LS_KEY); location.reload(); } }
  };
  main.onchange = (e) => {
    const id = e.target.id;
    if (e.target.dataset.orc) { const v = Number(e.target.value); if (v > 0) D.orcamentos[e.target.dataset.orc] = v; else delete D.orcamentos[e.target.dataset.orc]; ALERTAS = null; salvar(); return; }
    if (id === "fConta") filtro.conta = e.target.value; else if (id === "fCat") filtro.cat = e.target.value; else if (id === "fPessoa") filtro.pessoa = e.target.value;
    else if (id === "fNat") filtro.nat = e.target.value; else if (id === "fSoMes") filtro.soMes = e.target.checked; else if (id === "fSoRevisar") filtro.soRevisar = e.target.checked; else if (id === "fSoTerceiros") { filtro.soTerceiros = e.target.checked; if (!e.target.checked) filtro.terceiro = ""; }
    else if (id === "importar") { if (e.target.files[0]) importar(e.target.files[0]); return; }
    else if (id === "fpConta") fPag.conta = e.target.value; else if (id === "fpCat") fPag.cat = e.target.value; else if (id === "fpPessoa") fPag.pessoa = e.target.value;
    else if (id === "fpNat") fPag.nat = e.target.value; else if (id === "fpQuinz") fPag.quinz = e.target.value; else if (id === "fpSit") fPag.sit = e.target.value; else if (id === "fpTerc") fPag.terc = e.target.value;
    else return;
    render();
  };
  main.oninput = (e) => {
    if (e.target.id === "fTexto") { filtro.texto = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#fTexto"); el.focus(); el.setSelectionRange(pos, pos); }
    else if (e.target.id === "fpTexto") { fPag.texto = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#fpTexto"); el.focus(); el.setSelectionRange(pos, pos); }
  };
  // lembra quais faturas/pessoas estão abertas na aba A pagar entre uma renderização e outra
  main.querySelectorAll("details[data-k]").forEach((d) => d.addEventListener("toggle", () => { if (d.open) PAG_ABERTOS.add(d.dataset.k); else PAG_ABERTOS.delete(d.dataset.k); }));
  main.onmousemove = (e) => { const col = e.target.closest("[data-tip]"), tip = $("#tip"); if (!col) { tip.style.display = "none"; return; } tip.textContent = col.dataset.tip; tip.style.display = "block"; tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12) + "px"; tip.style.top = (e.clientY - 36) + "px"; };
  main.onmouseleave = () => ($("#tip").style.display = "none");
}
$("#nav").onclick = (e) => { const b = e.target.closest("button"); if (b) { aba = b.dataset.aba; render(); window.scrollTo(0, 0); } };
$("#mesAnt").onclick = () => { mesAtual = somaMes(mesAtual, -1); render(); };

// arrastar e soltar: arquivo de extrato vira importação; texto (ou .txt) do comprovante abre "Colar comprovante"
(function () {
  const sol = $("#solte"); let dentro = 0;
  const temCoisa = (e) => [...(e.dataTransfer?.types || [])].some((t) => t === "Files" || t === "text/plain");
  const mostra = (v) => sol.classList.toggle("on", v);
  const ehExtrato = (t) => /<OFX>|<STMTTRN>/i.test(t) || csvParse(t).length >= 3;
  document.addEventListener("dragenter", (e) => { if (!temCoisa(e)) return; dentro++; mostra(true); });
  document.addEventListener("dragleave", () => { dentro = Math.max(0, dentro - 1); if (!dentro) mostra(false); });
  document.addEventListener("dragend", () => { dentro = 0; mostra(false); });
  document.addEventListener("dragover", (e) => { if (temCoisa(e)) e.preventDefault(); });
  document.addEventListener("drop", async (e) => {
    dentro = 0; mostra(false);
    const alvo = e.target;
    if (alvo && /^(TEXTAREA|INPUT)$/.test(alvo.tagName) && !alvo.disabled && alvo.type !== "file") return; // soltar dentro de um campo: o navegador cola o texto ali
    e.preventDefault();
    const dt = e.dataTransfer, arqs = [...(dt.files || [])], dlgAberto = $("#dlg").open;
    if (arqs.length) {
      const f = arqs[0];
      if (arqs.length > 1) avisar(`Solte um arquivo por vez. Abrindo só ${f.name}.`);
      if (/^image\//.test(f.type) || f.type === "application/pdf" || /\.(png|jpe?g|heic|heif|webp|gif|pdf)$/i.test(f.name)) return lerArquivoComprovante(f);
      if (dlgAberto) return avisar("Feche a janela aberta antes de soltar outro arquivo.");
      if (!D.contas.length) return avisar("Cadastre um cartão ou conta antes.");
      let txt = ""; try { txt = (await lerArquivoTexto(f)).replace(/^\uFEFF/, ""); } catch (err) {}
      if (/\.(csv|ofx|qfx)$/i.test(f.name) || ehExtrato(txt)) return importarExtrato(f);
      if (txt.trim()) return colarComprovante(txt);
      return avisar("Não reconheci o arquivo. Use o extrato em CSV/OFX ou o texto do comprovante.");
    }
    const t = dt.getData("text/plain");
    if (!t || !t.trim()) return;
    if (dlgAberto) { const ta = $("#dlg textarea[name=t]"); if (ta) { ta.value = t; ta.dispatchEvent(new Event("input", { bubbles: true })); } else avisar("Feche a janela aberta antes de soltar o texto."); return; }
    if (!D.contas.length) return avisar("Cadastre um cartão ou conta antes.");
    if (ehExtrato(t)) return importarExtrato(new File([t], "texto-arrastado.csv", { type: "text/csv" }));
    colarComprovante(t);
  });
})();
