<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b4fa0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Finanças Angelo</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eef1f6; --surface: #ffffff; --surface-2: #f3f5f9; --surface-3: #e7ebf2; --border: #e1e5ec;
    --text: #0f172a; --text-2: #475569; --muted: #8b95a7;
    --accent: #1b4fa0; --accent-2: #2a78d6; --accent-soft: #e4edfb; --accent-ink: #ffffff;
    --good: #0f8a3c; --good-soft: #e3f5ea; --warn: #b26a00; --warn-soft: #fff1d6; --bad: #c62828; --bad-soft: #fde7e7; --info-soft: #e4edfb;
    --receita: #2a78d6; --despesa: #eb6834; --invest: #1baf7a;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.06);
    --shadow-lg: 0 12px 40px rgba(15,23,42,.18);
    --r: 16px; --r-sm: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e1117; --surface: #171b24; --surface-2: #1e2330; --surface-3: #262c3a; --border: #2a3140;
      --text: #f1f4f9; --text-2: #b7c0d0; --muted: #7d879a;
      --accent: #3b82f6; --accent-2: #60a5fa; --accent-soft: #1b2a47; --accent-ink: #ffffff;
      --good: #34c26b; --good-soft: #15321f; --warn: #f0a93a; --warn-soft: #3a2b10; --bad: #f36b6b; --bad-soft: #3d1a1a; --info-soft: #1b2a47;
      --receita: #3987e5; --despesa: #d95926; --invest: #199e70;
      --shadow: none; --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e1117; --surface: #171b24; --surface-2: #1e2330; --surface-3: #262c3a; --border: #2a3140;
      --text: #f1f4f9; --text-2: #b7c0d0; --muted: #7d879a;
      --accent: #3b82f6; --accent-2: #60a5fa; --accent-soft: #1b2a47; --accent-ink: #ffffff;
      --good: #34c26b; --good-soft: #15321f; --warn: #f0a93a; --warn-soft: #3a2b10; --bad: #f36b6b; --bad-soft: #3d1a1a; --info-soft: #1b2a47;
      --receita: #3987e5; --despesa: #d95926; --invest: #199e70;
      --shadow: none; --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body { overflow-x: hidden; max-width: 100vw; }
  .duas > *, .grid > *, .hero .mini > *, .lista, .item .txt { min-width: 0; }
  .tile .valor, .hero .big, .hero .mini b { overflow-wrap: anywhere; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-2); }

  /* ---------- cabeçalho ---------- */
  header { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topo { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 10px 18px; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; font-size: 17px; }
  .marca .logo { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px; }
  .pager { display: flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; margin-left: auto; }
  .pager button { border: 0; background: transparent; width: 40px; height: 36px; border-radius: 999px; cursor: pointer; color: var(--text-2); display: grid; place-items: center; }
  .pager button:hover { background: var(--surface-3); }
  .pager strong { min-width: 128px; text-align: center; font-size: 15px; text-transform: capitalize; font-weight: 650; padding: 6px 4px; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .status.salvando::before { background: var(--warn); } .status.erro::before { background: var(--bad); }
  nav { max-width: 1120px; margin: 0 auto; display: flex; gap: 4px; padding: 0 12px 6px; overflow-x: auto; scrollbar-width: none; }
  nav button { display: flex; align-items: center; gap: 7px; background: transparent; border: 0; padding: 7px 12px; border-radius: 999px; color: var(--text-2); cursor: pointer; white-space: nowrap; font-weight: 500; font-size: 14px; }
  nav button svg { width: 17px; height: 17px; }
  nav button.ativo { background: var(--accent-soft); color: var(--accent); font-weight: 650; }

  main { max-width: 1120px; margin: 0 auto; padding: 18px; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; letter-spacing: -.01em; }
  h2 .acoes { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  h2 small { font-weight: 450; color: var(--muted); font-size: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 16px; overflow-x: auto; }
  .duas { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 920px) { .duas { grid-template-columns: 1fr 1fr; } }

  /* ---------- herói ---------- */
  .hero { border-radius: var(--r); padding: 20px 22px; color: #fff; background: radial-gradient(120% 160% at 100% 0%, #3b82f6 0%, #1b4fa0 48%, #11306a 100%); box-shadow: var(--shadow-lg); margin-bottom: 16px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -40px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.07); }
  .hero .rot { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .hero .big { font-size: 38px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .hero .sub { font-size: 13px; opacity: .85; }
  .hero .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .hero .mini div { background: rgba(255,255,255,.12); border-radius: 12px; padding: 10px 12px; }
  .hero .mini span { display: block; font-size: 11px; opacity: .8; text-transform: uppercase; letter-spacing: .05em; }
  .hero .mini b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero .mini b.neg { color: #ffb4a8; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .rotulo { font-size: 12px; color: var(--text-2); font-weight: 500; }
  .tile .valor { font-size: 22px; font-weight: 750; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---------- listas ---------- */
  .lista { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: 0; }
  .item.clicavel:hover { background: var(--surface-2); margin: 0 -8px; padding-left: 12px; padding-right: 12px; border-radius: var(--r-sm); }
  .avatar { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; }
  .item .txt { flex: 1; min-width: 0; }
  .item .tit { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .dir { text-align: right; flex: none; }
  .item .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  .item .val.pos { color: var(--good); }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
  .pill.pago { background: var(--good-soft); color: var(--good); }
  .pill.vence { background: var(--warn-soft); color: var(--warn); }
  .pill.atraso { background: var(--bad-soft); color: var(--bad); }
  .pill.rev { background: var(--warn-soft); color: var(--warn); }
  .pill.ok { background: var(--accent-soft); color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: 0; }
  tr.sub td { color: var(--text-2); } tr.sub td:first-child { padding-left: 24px; }
  tr.clicavel:hover td { background: var(--surface-2); }
  .grupo-tit td { background: var(--surface-2); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }

  .barra { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; position: relative; min-width: 70px; }
  .barra i { display: block; height: 100%; border-radius: 999px; }
  .barra b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text-2); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }

  /* ---------- alertas ---------- */
  .alerta { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin: 8px 0; border-radius: 12px; background: var(--warn-soft); color: var(--text); font-size: 14px; line-height: 1.4; }
  .alerta .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--warn); color: #fff; font-size: 12px; font-weight: 800; }
  .alerta.ruim { background: var(--bad-soft); } .alerta.ruim .ico { background: var(--bad); }
  .alerta.bom { background: var(--good-soft); } .alerta.bom .ico { background: var(--good); }
  .alerta.info { background: var(--info-soft); } .alerta.info .ico { background: var(--accent-2); }

  /* ---------- botões / campos ---------- */
  button.btn, .btn { border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 7px 14px; cursor: pointer; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primario { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
  .btn.primario:hover { background: var(--accent-2); }
  .btn.perigo { color: var(--bad); }
  .btn.mini { padding: 3px 10px; font-size: 12px; }
  .btn.quadrado { border-radius: var(--r-sm); }
  input, select, textarea { padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); width: 100%; font-size: 16px; outline: none; }
  input:focus, select:focus { border-color: var(--accent-2); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=checkbox] { width: 18px; height: 18px; }
  label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; font-weight: 500; }
  .campo { margin-bottom: 12px; }
  .linha { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .linha3 { display: grid; gap: 10px; grid-template-columns: 1fr 1fr 1fr; }
  .seg { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 8px; cursor: pointer; color: var(--text-2); font-weight: 500; font-size: 13px; }
  .seg button.ativo { background: var(--surface); color: var(--text); font-weight: 650; box-shadow: var(--shadow); }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .filtros select, .filtros input { width: auto; min-width: 120px; flex: 1; font-size: 16px; padding: 8px 10px; }
  .filtros label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
  .vazio { color: var(--muted); padding: 22px; text-align: center; font-size: 14px; }
  .pequeno { font-size: 12px; color: var(--muted); }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .clicavel { cursor: pointer; }
  .acoes-tabela { white-space: nowrap; text-align: right; }

  dialog { border: 0; border-radius: var(--r); padding: 0; max-width: 560px; width: calc(100% - 24px); background: var(--surface); color: var(--text); max-height: 92vh; box-shadow: var(--shadow-lg); }
  dialog::backdrop { background: rgba(10,15,30,.45); backdrop-filter: blur(2px); }
  dialog form { padding: 20px; }
  dialog h3 { margin: 0 0 16px; font-size: 17px; font-weight: 750; letter-spacing: -.01em; }
  .rodape-form { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .rodape-form .esq { margin-right: auto; }

  .legenda { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin: 4px 0 10px; flex-wrap: wrap; }
  .proj { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; align-items: end; height: 160px; padding: 6px 0 0; }
  .proj .col { display: flex; gap: 3px; align-items: end; height: 100%; }
  .proj .col i { flex: 1; border-radius: 4px 4px 0 0; min-height: 3px; display: block; opacity: .95; }
  .proj-x { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; }
  .so-m { display: none; }
  /* aba A pagar: quinzenas, faturas e pessoas expansíveis */
  .sec-tit { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 4px; color: var(--text-2); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .sec-tit:first-child { margin-top: 0; }
  .sec-tit small { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
  details.fat { border-bottom: 1px solid var(--border); }
  details.fat:last-of-type { border-bottom: 0; }
  details.fat > summary { list-style: none; cursor: pointer; border-bottom: 0; }
  details.fat > summary::-webkit-details-marker { display: none; }
  details.fat .seta { display: inline-block; margin-right: 6px; color: var(--muted); transition: transform .15s; }
  details.fat[open] .seta { transform: rotate(90deg); }
  details.fat .sub-lista { margin: 0 0 10px 50px; padding-left: 10px; border-left: 2px solid var(--border); }
  .pchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .total-linha { display: flex; justify-content: space-between; padding: 12px 4px 0; font-weight: 700; border-top: 2px solid var(--border); margin-top: 10px; }
  .hero .mini small { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .chip.ativo { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .faixa-atualizacao { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 10px 14px; background: var(--accent); color: var(--accent-ink); font-size: 14px; }
  .faixa-atualizacao button { background: #fff; color: var(--accent); border: 0; border-radius: 999px; padding: 5px 12px; font-weight: 700; cursor: pointer; }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: 12px; z-index: 20; display: none; white-space: nowrap; }
  .fab { display: none; position: fixed; right: 18px; bottom: calc(74px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 18px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; border: 0; box-shadow: 0 10px 24px rgba(27,79,160,.4); z-index: 6; padding: 0; place-items: center; }
  .fab svg { width: 26px; height: 26px; }
  .orc-input { width: 110px; text-align: right; padding: 6px 8px; font-size: 16px; }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 30; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px); text-align: center; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  #dlg2 { max-width: 420px; }
  textarea.copia { min-height: 160px; font: 16px/1.4 ui-monospace, Consolas, monospace; }
  .passos { margin: 0; padding-left: 20px; line-height: 1.7; }
  .banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 13px; margin-bottom: 14px; }
  dialog { overflow: auto; }
  dialog.largo { max-width: 920px; }
  /* importar extrato: conferência linha a linha */
  .imp-lista { max-height: 52vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0 10px; background: var(--surface); }
  .imp-linha { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .imp-linha:last-child { border-bottom: 0; }
  .imp-linha.fora { opacity: .5; }
  .imp-linha .chk { padding-top: 8px; flex: none; }
  .imp-corpo { flex: 1; min-width: 0; }
  .imp-top { display: flex; gap: 8px; align-items: center; }
  .imp-top input { padding: 7px 10px; flex: 1; min-width: 0; }
  .imp-top .val { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .imp-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 5px 0; }
  .imp-sel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .imp-sel select, .imp-sel input { padding: 6px 8px; font-size: 14px; }
  .imp-sel > * { min-width: 0; }
  .imp-lista { overflow-x: hidden; }
  button.pill { cursor: pointer; border: 1px dashed var(--border); background: transparent; }
  .pill-x { border: 0; background: transparent; color: inherit; padding: 0 0 0 2px; cursor: pointer; font-size: 11px; line-height: 1; }
  /* relatório do mês */
  .rel h4 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); display: flex; gap: 8px; align-items: baseline; }
  .rel h4 small { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .rel-cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid var(--text); padding-bottom: 8px; }
  .rel-tit { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .rel-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rel-marca { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .rel-marca .logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  .rel-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .rel-kpis .tile { padding: 10px 12px; } .rel-kpis .valor { font-size: 18px; }
  .rel table td, .rel table th { padding: 5px 6px; font-size: 13px; overflow-wrap: normal; }
  .rel .tbl { overflow-x: auto; }
  .rel td:first-child { min-width: 150px; }
  .rel td.num, .rel th.num { white-space: nowrap; }
  .rel .vazio { padding: 10px; text-align: left; }
  .rel-lista { margin: 0; padding-left: 18px; line-height: 1.8; font-size: 13px; }
  .rel-rodape { margin-top: 18px; font-size: 11px; color: var(--muted); text-align: center; }
  #relPrint { display: none; }

<script>
(function () {
// Agente de alertas — Finanças Angelo
// Lê dados/financas.json e gera alertas de inadimplência e de investimento.
// Uso:
//   node agente.js              -> imprime os alertas
//   node agente.js --notificar  -> além de imprimir, grava relatório em Memória de Projetos/pessoal e mostra notificação do Windows
// Também é usado pelo server.js (GET /api/alertas).

const NODE = typeof require !== "undefined" && typeof process !== "undefined" && process.versions && process.versions.node;
const fs = NODE ? require("fs") : null;
const path = NODE ? require("path") : null;
const { spawnSync } = NODE ? require("child_process") : {};

const ARQUIVO = NODE ? path.join(__dirname, "dados", "financas.json") : null;
const HOME = NODE ? (process.env.USERPROFILE || process.env.HOME) : "";
const RELATORIO = NODE ? path.join(HOME, "Documents", "Memória de Projetos", "pessoal", "alertas-financas.md") : null;

// Limites das regras (ajuste aqui)
const REGRAS = {
  diasAvisoVencimento: 3,       // avisa faturas que vencem em até N dias
  pctParcelasAlerta: 0.35,      // parcelas do próximo mês acima de 35% da receita = endividamento alto
  pctLimiteCartao: 0.8,         // fatura acima de 80% do limite
  diasSaldoInvestDesatualizado: 35,
  mesesReservaMinima: 3,        // reserva de emergência de referência: 3 meses de despesas
  pctSugestaoAporte: 0.1,       // lembra de guardar 10% da receita quando não há aporte no mês
  diaConferenciaCredito: 5,     // a partir deste dia lembra de conferir Registrato (Banco Central) e Serasa no mês
};

// ---------- utilidades de mês/parcela (mesmas regras do index.html) ----------
const mesIdx = (m) => { const [a, b] = m.split("-").map(Number); return a * 12 + (b - 1); };
const idxMes = (i) => `${Math.floor(i / 12)}-${String((i % 12) + 1).padStart(2, "0")}`;
const somaMes = (m, n) => idxMes(mesIdx(m) + n);
const fmt = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const R$ = (v) => fmt.format(Math.round((v || 0) * 100) / 100);
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const mesLongo = (m) => { const [a, b] = m.split("-").map(Number); return `${MESES[b - 1]} de ${a}`; };

function parcelaNoMes(l, mes) {
  const dif = mesIdx(mes) - mesIdx(l.mesInicio);
  if (dif < 0) return null;
  if (!l.parcelas) { if (l.mesFim && mesIdx(mes) > mesIdx(l.mesFim)) return null; return { n: null }; }
  const n = (l.parcelaInicial || 1) + dif;
  return n >= 1 && n <= l.parcelas ? { n } : null;
}
const soma = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

function gerarAlertas(D, hoje = new Date()) {
  hoje = new Date(hoje); hoje.setHours(0, 0, 0, 0);
  const mes = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, "0")}`;
  const alertas = []; // {nivel: 'critico'|'aviso'|'info'|'bom', area: 'inadimplencia'|'investimento'|'orcamento', texto}
  const add = (nivel, area, texto) => alertas.push({ nivel, area, texto });

  const doMes = (m, tipo) => D.lancamentos.filter((l) => l.tipo === tipo && parcelaNoMes(l, m));
  const desp = doMes(mes, "despesa"), rec = doMes(mes, "receita"), inv = doMes(mes, "investimento");
  const td = soma(desp, (l) => l.valor), tr = soma(rec, (l) => l.valor), ti = soma(inv, (l) => l.valor);
  const saldoIni = Number((D.saldos || {})[mes] || 0);
  const recebido = soma(desp.filter((l) => l.terceiro && l.recebidos && l.recebidos[mes]), (l) => l.valor);
  const sobra = saldoIni + tr - td - ti + recebido;

  // ---- Inadimplência: faturas vencidas / vencendo ----
  for (const c of D.contas.filter((c) => c.porCompra)) {
    // crediário: cada compra vence no dia da compra e é paga separadamente
    for (const l of desp.filter((l) => l.contaId === c.id)) {
      if (l.pagos && l.pagos[mes]) continue;
      if (!l.data) { add("info", "inadimplencia", `${c.nome}: "${l.descricao}" está sem data da compra, então não sei o vencimento.`); continue; }
      const dia = Number(l.data.split("-")[2]);
      const venc = new Date(hoje.getFullYear(), hoje.getMonth(), Math.min(dia, new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate()));
      const dias = Math.round((venc - hoje) / 864e5);
      if (dias < 0) add("critico", "inadimplencia", `${c.nome} · ${l.descricao} VENCEU há ${-dias} dia(s) e não está marcada como paga: ${R$(l.valor)}.`);
      else if (dias === 0) add("critico", "inadimplencia", `${c.nome} · ${l.descricao} vence HOJE: ${R$(l.valor)}.`);
      else if (dias <= REGRAS.diasAvisoVencimento) add("aviso", "inadimplencia", `${c.nome} · ${l.descricao} vence em ${dias} dia(s) (dia ${dia}): ${R$(l.valor)}.`);
    }
  }
  for (const c of D.contas.filter((c) => !c.porCompra)) {
    const itens = desp.filter((l) => l.contaId === c.id);
    const total = soma(itens, (l) => l.valor);
    if (total <= 0.004 || !c.vencimento) continue;
    const pago = (D.pagamentos || []).find((p) => p.mes === mes && p.contaId === c.id);
    if (pago) {
      if (pago.valor < total - 0.01) add("aviso", "inadimplencia", `${c.nome}: pago ${R$(pago.valor)} de ${R$(total)}. Faltam ${R$(total - pago.valor)} (juros de cartão são altos; quite se puder).`);
      continue;
    }
    const venc = new Date(hoje.getFullYear(), hoje.getMonth(), c.vencimento);
    const dias = Math.round((venc - hoje) / 864e5);
    if (dias < 0) add("critico", "inadimplencia", `${c.nome} VENCEU há ${-dias} dia(s) e não está marcada como paga: ${R$(total)}. Pague hoje ou marque como paga no app.`);
    else if (dias === 0) add("critico", "inadimplencia", `${c.nome} vence HOJE: ${R$(total)}.`);
    else if (dias <= REGRAS.diasAvisoVencimento) add("aviso", "inadimplencia", `${c.nome} vence em ${dias} dia(s) (dia ${c.vencimento}): ${R$(total)}.`);
  }

  // ---- Inadimplência: limite do cartão (fatura aberta + parcelas futuras) ----
  for (const c of D.contas.filter((c) => c.tipo === "cartao" && c.limite)) {
    const pago = (D.pagamentos || []).some((p) => p.mes === mes && p.contaId === c.id);
    const fat = c.porCompra ? soma(desp.filter((l) => l.contaId === c.id && !(l.pagos && l.pagos[mes])), (l) => l.valor) : (pago ? 0 : soma(desp.filter((l) => l.contaId === c.id), (l) => l.valor));
    let fut = 0;
    for (const l of D.lancamentos) {
      if (l.tipo !== "despesa" || l.contaId !== c.id || l.parcelas < 2) continue;
      const ult = somaMes(l.mesInicio, l.parcelas - (l.parcelaInicial || 1));
      for (let i = mesIdx(mes) + 1; i <= mesIdx(ult); i++) if (parcelaNoMes(l, idxMes(i))) fut += l.valor;
    }
    const usado = fat + fut;
    if (usado > c.limite) add("critico", "inadimplencia", `${c.nome} ESTOUROU o limite: ${R$(usado)} tomados de ${R$(c.limite)} (fatura ${R$(fat)} + parcelas futuras ${R$(fut)}).`);
    else if (usado / c.limite >= REGRAS.pctLimiteCartao) add("aviso", "inadimplencia", `${c.nome} está com ${Math.round((usado / c.limite) * 100)}% do limite tomado (${R$(usado)} de ${R$(c.limite)}; só ${R$(c.limite - usado)} livres).`);
  }

  // ---- Terceiros: compras no seu cartão ainda não devolvidas ----
  const pend = {};
  for (const l of D.lancamentos) {
    if (l.tipo !== "despesa" || !l.terceiro) continue;
    const fim = l.parcelas ? somaMes(l.mesInicio, l.parcelas - (l.parcelaInicial || 1)) : mes;
    for (let i = mesIdx(l.mesInicio); i <= Math.min(mesIdx(mes), mesIdx(fim)); i++) {
      const m = idxMes(i); if (parcelaNoMes(l, m) && !(l.recebidos && l.recebidos[m])) pend[l.terceiro] = (pend[l.terceiro] || 0) + l.valor;
    }
  }
  for (const [nome, v] of Object.entries(pend)) add(v >= 200 ? "aviso" : "info", "inadimplencia", `${nome} ainda deve ${R$(v)} de compras feitas no seu cartão. Cobre e marque como recebido no app.`);

  // ---- Orçamento: mês negativo e endividamento ----
  if (sobra < 0) add("critico", "orcamento", `O mês de ${mesLongo(mes)} fecha NEGATIVO em ${R$(-sobra)} (receitas ${R$(tr)} + saldo inicial ${R$(saldoIni)} − despesas ${R$(td)}). Risco de atrasar fatura.`);
  else if (tr > 0 && sobra / tr < 0.05) add("aviso", "orcamento", `Sobra apertada em ${mesLongo(mes)}: ${R$(sobra)}. Qualquer imprevisto vira atraso.`);

  const prox = somaMes(mes, 1);
  const parcProx = soma(doMes(prox, "despesa").filter((l) => l.parcelas > 1), (l) => l.valor);
  const recProx = soma(doMes(prox, "receita"), (l) => l.valor) || tr;
  if (recProx > 0 && parcProx / recProx >= REGRAS.pctParcelasAlerta) add("aviso", "orcamento", `Parcelas já comprometem ${Math.round((parcProx / recProx) * 100)}% da receita de ${mesLongo(prox)} (${R$(parcProx)}). Evite parcelar mais até cair.`);

  // próximos 3 meses negativos?
  for (let i = 1; i <= 3; i++) {
    const m = somaMes(mes, i);
    const s = soma(doMes(m, "receita"), (l) => l.valor) - soma(doMes(m, "despesa"), (l) => l.valor) - soma(doMes(m, "investimento"), (l) => l.valor);
    if (s < 0) { add("aviso", "orcamento", `Projeção de ${mesLongo(m)} já está negativa em ${R$(-s)} só com o que está lançado.`); break; }
  }

  // orçamento por categoria
  for (const [catId, orc] of Object.entries(D.orcamentos || {})) {
    const gasto = soma(desp.filter((l) => l.categoriaId === catId), (l) => l.valor);
    const cat = (D.categorias || []).find((c) => c.id === catId);
    const nome = cat ? cat.nome : catId;
    if (orc > 0 && gasto > orc) add("aviso", "orcamento", `Orçamento de "${nome}" estourado: ${R$(gasto)} de ${R$(orc)} (${Math.round((gasto / orc) * 100)}%).`);
    else if (orc > 0 && gasto >= orc * 0.9) add("info", "orcamento", `"${nome}" já usou ${Math.round((gasto / orc) * 100)}% do orçamento do mês.`);
  }

  // parcelas que acabam este mês = alívio
  const terminam = desp.filter((l) => l.parcelas > 1 && parcelaNoMes(l, mes).n === l.parcelas);
  if (terminam.length) add("bom", "orcamento", `Última parcela este mês: ${terminam.map((l) => `${l.descricao} (${R$(l.valor)})`).join(", ")}. Mês que vem alivia ${R$(soma(terminam, (l) => l.valor))}.`);

  // ---- Investimentos ----
  const patrimonio = soma(D.investimentos || [], (i) => Number(i.saldo || 0));
  if (!(D.investimentos || []).length) {
    add("info", "investimento", "Nenhum investimento cadastrado. Cadastre onde você guarda dinheiro (poupança, CDB, Tesouro, previdência dos filhos) para o agente acompanhar.");
  } else {
    const mesesReserva = td > 0 ? patrimonio / td : 0;
    if (mesesReserva < REGRAS.mesesReservaMinima) add("aviso", "investimento", `Reserva cobre ${mesesReserva.toFixed(1)} mês(es) de despesas (${R$(patrimonio)} para ${R$(td)}/mês). Referência comum: ${REGRAS.mesesReservaMinima} meses.`);
    else add("bom", "investimento", `Reserva cobre ${mesesReserva.toFixed(1)} meses de despesas (${R$(patrimonio)}).`);
    for (const i of D.investimentos) {
      if (!i.atualizadoEm) continue;
      const [d, m, a] = i.atualizadoEm.split("/").map(Number);
      const dias = Math.round((hoje - new Date(a, m - 1, d)) / 864e5);
      if (dias > REGRAS.diasSaldoInvestDesatualizado) add("info", "investimento", `Saldo de "${i.nome}" não é atualizado há ${dias} dias. Confira no app do banco e atualize.`);
    }
  }
  if (ti <= 0 && sobra > 0 && tr > 0) {
    const sugestao = Math.min(sobra, tr * REGRAS.pctSugestaoAporte);
    add("info", "investimento", `Nenhum aporte lançado em ${mesLongo(mes)} e a sobra prevista é ${R$(sobra)}. Guardar ${R$(sugestao)} (${Math.round(REGRAS.pctSugestaoAporte * 100)}% da receita) já mantém o hábito.`);
  } else if (ti > 0) add("bom", "investimento", `Aportes de ${R$(ti)} lançados em ${mesLongo(mes)}.`);

  // ---- Conferência mensal do nome: Registrato (Banco Central) e Serasa ----
  if (!(D.conferenciaCredito || {})[mes] && hoje.getDate() >= REGRAS.diaConferenciaCredito)
    add(NODE ? "info" : "aviso", "inadimplencia", `Conferência de ${mesLongo(mes)} pendente: veja no Registrato (Banco Central) e no Serasa se apareceu dívida, empréstimo ou consulta em seu nome que não está no app. Depois toque em "Já conferi" no Resumo.`);

  // ---- Dados pendentes ----
  const revisar = desp.filter((l) => l.revisar).length;
  if (revisar) add("info", "orcamento", `${revisar} lançamento(s) importados da planilha ainda sem descrição/categoria conferida.`);
  if (!rec.length) add("aviso", "orcamento", `Nenhuma receita lançada para ${mesLongo(mes)}. Sem receita o agente não consegue avaliar se o mês fecha.`);

  const ordem = { critico: 0, aviso: 1, info: 2, bom: 3 };
  alertas.sort((a, b) => ordem[a.nivel] - ordem[b.nivel]);
  return { geradoEm: new Date().toISOString(), mes, resumo: { receitas: tr, despesas: td, aportes: ti, saldoInicial: saldoIni, sobra, patrimonio }, alertas };
}

// ---------- relatório e notificação ----------
function relatorioMarkdown(r) {
  const ico = { critico: "🔴", aviso: "🟠", info: "🔵", bom: "🟢" };
  const linhas = [`# Alertas de finanças — ${new Date(r.geradoEm).toLocaleString("pt-BR")}`, "",
    `Mês: ${mesLongo(r.mes)} · receitas ${R$(r.resumo.receitas)} · despesas ${R$(r.resumo.despesas)} · sobra ${R$(r.resumo.sobra)} · investido ${R$(r.resumo.patrimonio)}`, ""];
  for (const area of ["inadimplencia", "orcamento", "investimento"]) {

  const st = $("#status"); st.textContent = "salvando…"; st.className = "status salvando";
  salvarTimer = setTimeout(async () => {
    try {
      await Store.salvar(D);
      const h = new Date();
      st.textContent = (Store.modo === "local" ? "neste aparelho · " : "servidor · ") + `${String(h.getHours()).padStart(2, "0")}:${String(h.getMinutes()).padStart(2, "0")}`; st.className = "status";
    } catch (e) { st.textContent = "NÃO GRAVOU"; st.className = "status erro"; if (!Store.avisou) { Store.avisou = true; avisar("Não consegui salvar: " + e.message); } }
  }, 350);
}
function mudou() { ALERTAS = null; salvar(); render(); agendarBadge(); }

function render() {
  $("#mesLabel").textContent = mesLongo(mesAtual);
  $("#nav").innerHTML = ABAS.map(([k, nome, ic]) => `<button data-aba="${k}" class="${aba === k ? "ativo" : ""}">${ic}<span>${nome}</span></button>`).join("");

  $("#main").innerHTML = fn(t);
  ligarEventos();
}

// ============ A pagar: total do mês, por quinzena, por pessoa ============
let fPag = { conta: "", cat: "", pessoa: "", nat: "", quinz: "", sit: "", texto: "", terc: "" }; // terc: "" todos · "_meus" · "_terc" · nome do terceiro
const PAG_ABERTOS = new Set();
const QUINZ_NOME = { 1: "1ª quinzena", 2: "2ª quinzena", 0: "Sem dia de vencimento" };
function quinzenaDe(dia) { return dia == null ? 0 : dia <= 15 ? 1 : 2; }
// Cada despesa do mês com cartão, dia de vencimento, quinzena, se já foi paga e a pessoa
function itensAPagar(mes) {
  return itensDoMes(mes, "despesa").map((x) => {
    const c = conta(x.l.contaId), dia = diaVenc(x.l, c);
    const pago = pagoNoMes(x.l, mes) || !!(c && !c.porCompra && pagamento(mes, c.id));
    return { l: x.l, n: x.n, c, dia, q: quinzenaDe(dia), pago, pessoa: x.l.pessoa || D.pessoas[0] || "Sem pessoa" };
  });
}
function statusPag(x) {
  if (pagoNoMes(x.l, mesAtual)) return { cls: "pago", txt: "pago" };
  if (!x.c) return { cls: "", txt: "sem conta" };
  if (x.c.porCompra) return statusItem(mesAtual, x.l, x.c);
  return statusFatura(mesAtual, x.c, x.l.valor);
}
function linhaPag(x, comConta) {
  const cat = categoria(x.l.categoriaId), s = statusPag(x);
  const meta = [comConta && x.c ? x.c.nome : null, cat ? cat.nome : null, comConta ? null : x.pessoa, x.l.terceiro ? `para ${x.l.terceiro}` : null, x.dia ? `vence dia ${x.dia}` : "sem dia"].filter(Boolean).map(esc).join(" · ");
  return `<div class="item clicavel" data-acao="editar" data-id="${x.l.id}">
    <div class="avatar" style="background:${cat?.cor || "#8a8a8a"}">${esc(iniciais(cat?.nome || "?"))}</div>
    <div class="txt"><div class="tit">${esc(x.l.descricao)}${x.l.parcelas > 1 ? ` <span class="pequeno">${x.n}/${x.l.parcelas}</span>` : ""}</div><div class="meta">${meta}</div></div>
    <div class="dir"><div class="val">${R$(x.l.valor)}</div><span class="pill ${s.cls}">${s.txt}</span>${x.c?.porCompra ? `<button class="btn mini ${x.pago ? "" : "primario"}" data-acao="pagarItem" data-id="${x.l.id}" style="margin-top:4px">${x.pago ? "desfazer" : "pagar"}</button>` : ""}</div>
  </div>`;
}
function renderAPagar() {
  const todos = itensAPagar(mesAtual);
  const lista = todos.filter((x) => (!fPag.conta || x.l.contaId === fPag.conta) && (!fPag.cat || x.l.categoriaId === fPag.cat) && (!fPag.pessoa || x.pessoa === fPag.pessoa) && (!fPag.nat || natureza(x.l) === fPag.nat) && (fPag.quinz === "" || String(x.q) === fPag.quinz) && (!fPag.sit || (fPag.sit === "aberto" ? !x.pago : x.pago)) && (!fPag.terc || (fPag.terc === "_meus" ? !x.l.terceiro : fPag.terc === "_terc" ? !!x.l.terceiro : x.l.terceiro === fPag.terc)) && (!fPag.texto || (x.l.descricao + " " + (x.l.obs || "") + " " + (x.l.terceiro || "")).toLowerCase().includes(fPag.texto.toLowerCase())));
  const filtrado = Object.values(fPag).some(Boolean);
  const v = (arr) => soma(arr, (x) => x.l.valor);
  const total = v(lista), falta = v(lista.filter((x) => !x.pago)), pago = total - falta, terc = v(lista.filter((x) => x.l.terceiro));
  const porQ = (q) => { const it = lista.filter((x) => x.q === q); return { it, total: v(it), falta: v(it.filter((x) => !x.pago)) }; };
  const Q = { 1: porQ(1), 2: porQ(2), 0: porQ(0) };
  const opt = (arr, val, f) => arr.map((x) => `<option value="${esc(f ? x.id : x)}" ${(f ? x.id : x) === val ? "selected" : ""}>${esc(f ? x.nome : x)}</option>`).join("");
  const pessoas = [...new Set([...D.pessoas, ...todos.map((x) => x.pessoa)])];
  const [anoM, mesM] = mesAtual.split("-").map(Number), ultimoDia = new Date(anoM, mesM, 0).getDate();
  const fatTotal = (c) => v(todos.filter((x) => x.l.contaId === c.id));
  const miniQ = (q, rot) => `<div><span>${rot}</span><b>${R$(Q[q].total)}</b><small>${Q[q].falta > 0.004 ? "falta " + R$(Q[q].falta) : Q[q].total > 0.004 ? "tudo pago" : "nada"}</small></div>`;
  const detalhe = (k) => `<details class="fat" data-k="${esc(k)}" ${PAG_ABERTOS.has(k) ? "open" : ""}>`;
  const ordem = { atraso: 0, vence: 1, "": 2, pago: 3 };
  // bloco de uma quinzena: faturas/contas agrupadas, cada uma abre item a item
  const blocoQ = (q) => {
    const { it, total: totQ, falta: faltaQ } = Q[q]; if (!it.length) return "";
    const grupos = [];
    for (const x of it) { let g = grupos.find((g) => g.k === x.l.contaId); if (!g) { g = { k: x.l.contaId, c: x.c, itens: [] }; grupos.push(g); } g.itens.push(x); }
    const diaMin = (g) => Math.min(...g.itens.map((x) => x.dia || 99));
    grupos.sort((a, b) => diaMin(a) - diaMin(b) || (a.c?.nome || "").localeCompare(b.c?.nome || ""));
    return `<div class="sec-tit"><span>${QUINZ_NOME[q]}${q === 1 ? " · vence do dia 1 ao 15" : q === 2 ? ` · vence do dia 16 ao ${ultimoDia}` : ""}</span><span>${R$(totQ)}${faltaQ > 0.004 && faltaQ < totQ - 0.004 ? ` <small>falta ${R$(faltaQ)}</small>` : ""}</span></div>
    ${grupos.map((g) => {
      g.itens.sort((a, b) => (a.dia || 99) - (b.dia || 99) || b.l.valor - a.l.valor);
      const tot = v(g.itens), ab = g.itens.filter((x) => !x.pago), faltaG = v(ab), inteira = g.c ? fatTotal(g.c) : tot;
      const s = !g.c ? { cls: "", txt: "sem conta" } : g.c.porCompra ? (ab.map((x) => statusItem(mesAtual, x.l, g.c)).sort((a, b) => ordem[a.cls] - ordem[b.cls])[0] || { cls: "pago", txt: "tudo pago" }) : tot > 0.004 && faltaG < 0.005 ? { cls: "pago", txt: "pago" } : statusFatura(mesAtual, g.c, tot);
      const dias = [...new Set(g.itens.map((x) => x.dia).filter(Boolean))].sort((a, b) => a - b);
      const pessoasG = [...new Set(g.itens.map((x) => x.pessoa))];
      const pg = g.c && !g.c.porCompra ? pagamento(mesAtual, g.c.id) : null;
      return `${detalhe(`q${q}:${g.k}`)}
        <summary class="item">${g.c ? avatarConta(g.c) : `<div class="avatar" style="background:#8a8a8a">?</div>`}
          <div class="txt"><div class="tit"><span class="seta">›</span>${esc(g.c?.nome || "Sem conta")}${g.c?.final ? ` <span class="pequeno">•${esc(g.c.final)}</span>` : ""}</div><div class="meta">${g.itens.length} item(ns)${dias.length ? " · vence dia " + dias.join(", ") : ""} · ${pessoasG.map(esc).join(", ")}${faltaG > 0.004 && faltaG < tot - 0.004 ? " · falta " + R$(faltaG) : ""}${inteira > tot + 0.004 ? " · fatura inteira " + R$(inteira) : ""}</div></div>
          <div class="dir"><div class="val">${R$(tot)}</div><span class="pill ${s.cls}">${s.txt}</span>${g.c && !g.c.porCompra && tot > 0.004 ? (pg ? `<button class="btn mini" data-acao="desfazerPago" data-id="${g.c.id}" style="margin-top:4px">desfazer</button>` : `<button class="btn mini primario" data-acao="pagar" data-id="${g.c.id}" data-total="${inteira}" style="margin-top:4px">pagar fatura</button>`) : ""}</div>
        </summary>
        <div class="sub-lista lista">${g.itens.map((x) => linhaPag(x, false)).join("")}</div>
      </details>`;
    }).join("")}`;
  };
  // por pessoa: total, quinzenas, cartões e item a item
  const blocoPessoa = pessoas.map((p) => {
    const it = lista.filter((x) => x.pessoa === p).sort((a, b) => (a.dia || 99) - (b.dia || 99) || b.l.valor - a.l.valor); if (!it.length) return "";
    const tot = v(it), fal = v(it.filter((x) => !x.pago)), q1 = v(it.filter((x) => x.q === 1)), q2 = v(it.filter((x) => x.q === 2)), q0 = v(it.filter((x) => x.q === 0));
    const porConta = []; for (const x of it) { let g = porConta.find((g) => g.k === x.l.contaId); if (!g) { g = { k: x.l.contaId, c: x.c, total: 0 }; porConta.push(g); } g.total += x.l.valor; }
    porConta.sort((a, b) => b.total - a.total);
    return `${detalhe("p:" + p)}
      <summary class="item"><div class="avatar" style="background:var(--accent)">${esc(iniciais(p))}</div>
        <div class="txt"><div class="tit"><span class="seta">›</span>${esc(p)}</div><div class="meta">${it.length} item(ns) · ${pct(tot, total)} do total · 1ª quinz. ${R$(q1)} · 2ª quinz. ${R$(q2)}${q0 > 0.004 ? " · sem dia " + R$(q0) : ""}</div></div>
        <div class="dir"><div class="val">${R$(tot)}</div><span class="pill ${fal > 0.004 ? "" : "pago"}">${fal > 0.004 ? "falta " + R$(fal) : "tudo pago"}</span></div>
      </summary>
      <div class="sub-lista"><div class="pchips">${porConta.map((g) => `<span class="pill"><span class="dot" style="background:${g.c ? corConta(g.c) : "#8a8a8a"}"></span>${esc(g.c?.nome || "Sem conta")} ${R$(g.total)}</span>`).join("")}</div><div class="lista">${it.map((x) => linhaPag(x, true)).join("")}</div></div>
    </details>`;
  }).join("");
  return `
  <div class="hero">
    <div class="rot">A pagar · ${mesLongo(mesAtual)}${filtrado ? " · com filtros" : ""}</div>
    <div class="big">${R$(total)}</div>
    <div class="sub">${falta > 0.004 ? `falta pagar <b>${R$(falta)}</b>` : total > 0.004 ? "tudo pago" : "nada lançado"}${pago > 0.004 ? ` · já pago ${R$(pago)}` : ""} · ${lista.length} item(ns)${terc > 0.004 ? ` · ${R$(terc)} de terceiros (voltam para você)` : ""} · <a href="#" data-acao="relatorio" style="color:#fff;opacity:.85">relatório do mês</a></div>
    <div class="mini">${miniQ(1, "1ª quinzena · dias 1 a 15")}${miniQ(2, `2ª quinzena · dias 16 a ${ultimoDia}`)}${miniQ(0, "Sem dia de vencimento")}</div>
  </div>
  <div class="card">
    <div class="filtros">
      <input id="fpTexto" placeholder="buscar…" value="${esc(fPag.texto)}">
      <select id="fpQuinz"><option value="">as duas quinzenas</option><option value="1" ${fPag.quinz === "1" ? "selected" : ""}>1ª quinzena (1 a 15)</option><option value="2" ${fPag.quinz === "2" ? "selected" : ""}>2ª quinzena (16 a ${ultimoDia})</option><option value="0" ${fPag.quinz === "0" ? "selected" : ""}>sem dia de vencimento</option></select>
      <select id="fpSit"><option value="">pago e em aberto</option><option value="aberto" ${fPag.sit === "aberto" ? "selected" : ""}>só o que falta pagar</option><option value="pago" ${fPag.sit === "pago" ? "selected" : ""}>só o já pago</option></select>
      <select id="fpPessoa"><option value="">todas as pessoas</option>${opt(pessoas, fPag.pessoa)}</select>
      <select id="fpConta"><option value="">todos os cartões/contas</option>${opt(D.contas, fPag.conta, true)}</select>
      <select id="fpCat"><option value="">todas as categorias</option>${opt(D.categorias, fPag.cat, true)}</select>
      <select id="fpNat"><option value="">fixa / variável / parcelada</option>${Object.entries(NATUREZA).map(([k, n]) => `<option value="${k}" ${fPag.nat === k ? "selected" : ""}>${n}</option>`).join("")}</select>
      <select id="fpTerc"><option value="">meus e de terceiros</option><option value="_meus" ${fPag.terc === "_meus" ? "selected" : ""}>só gastos meus</option><option value="_terc" ${fPag.terc === "_terc" ? "selected" : ""}>só para terceiros</option>${terceirosLista().map((t) => `<option value="${esc(t)}" ${fPag.terc === t ? "selected" : ""}>para ${esc(t)}</option>`).join("")}</select>
      ${filtrado ? `<button class="btn mini" data-acao="pagLimpar">limpar filtros</button>` : ""}
    </div>
  </div>
  <div class="duas">
    <div class="card">
      <h2>Por quinzena <small>pelo dia do vencimento</small><span class="acoes"><button class="btn mini" data-acao="pagAbrir" data-v="1">abrir tudo</button><button class="btn mini" data-acao="pagAbrir" data-v="0">fechar</button><button class="btn mini primario" data-acao="relatorio">relatório do mês</button></span></h2>
      ${lista.length ? blocoQ(1) + blocoQ(2) + blocoQ(0) : `<div class="vazio">Nada a pagar com esses filtros.</div>`}
      <div class="total-linha"><span>Total do mês${filtrado ? " (filtrado)" : ""}</span><span>${R$(total)}</span></div>
    </div>
    <div class="card">
      <h2>Por pessoa <small>quem gera cada gasto</small></h2>
      ${lista.length ? `<div class="lista">${blocoPessoa}</div>` : `<div class="vazio">Nada atribuído.</div>`}
      <p class="pequeno" style="margin-top:8px">Toque na pessoa ou na fatura para ver item a item. "Para terceiro" é compra no seu cartão que alguém vai te devolver: entra no total a pagar, mas não é gasto seu.</p>
    </div>
  </div>`;
}

let filtro = { conta: "", cat: "", pessoa: "", tipo: "", nat: "", texto: "", soMes: true, soRevisar: false, soTerceiros: false, terceiro: "" };
function renderLancamentos() {
  let lista = filtro.soMes ? itensDoMes(mesAtual) : D.lancamentos.map((l) => ({ l, n: (parcelaNoMes(l, mesAtual) || {}).n }));
  lista = lista.filter(({ l }) => (!filtro.conta || l.contaId === filtro.conta) && (!filtro.cat || l.categoriaId === filtro.cat) && (!filtro.pessoa || (l.pessoa || "") === filtro.pessoa) && (!filtro.tipo || l.tipo === filtro.tipo) && (!filtro.nat || natureza(l) === filtro.nat) && (!filtro.soRevisar || l.revisar) && (!filtro.soTerceiros || l.terceiro) && (!filtro.terceiro || l.terceiro === filtro.terceiro) && (!filtro.texto || (l.descricao + " " + (l.obs || "")).toLowerCase().includes(filtro.texto.toLowerCase())));
  lista.sort((a, b) => (conta(a.l.contaId)?.nome || "").localeCompare(conta(b.l.contaId)?.nome || "") || b.l.valor - a.l.valor);
  const tot = soma(lista.filter((x) => x.l.tipo === "despesa"), (x) => x.l.valor);
  const opt = (arr, val, f) => arr.map((x) => `<option value="${esc(f ? x.id : x)}" ${(f ? x.id : x) === val ? "selected" : ""}>${esc(f ? x.nome : x)}</option>`).join("");
  // agrupa por conta
  const grupos = [];
  for (const it of lista) { const k = it.l.contaId; let g = grupos.find((g) => g.k === k); if (!g) { g = { k, c: conta(k), itens: [] }; grupos.push(g); } g.itens.push(it); }
  return `
  <div class="card">
    <h2>Lançamentos <small>${filtro.soMes ? mesLongo(mesAtual) : "todos"}</small>
      <span class="acoes"><button class="btn mini primario" data-acao="novo" data-tipo="despesa">${I.mais} despesa</button><button class="btn mini" data-acao="novo" data-tipo="receita">${I.mais} receita</button><button class="btn mini" data-acao="novo" data-tipo="investimento">${I.mais} aporte</button><button class="btn mini" data-acao="importarExtrato">importar extrato</button><button class="btn mini" data-acao="colarComprovante">comprovante</button></span></h2>
    <div class="filtros">
      <input id="fTexto" placeholder="buscar…" value="${esc(filtro.texto)}">
      <select id="fConta"><option value="">todas as contas</option>${opt(D.contas, filtro.conta, true)}</select>
      <select id="fCat"><option value="">todas as categorias</option>${opt(D.categorias, filtro.cat, true)}</select>
      <select id="fPessoa" class="ocultar-m"><option value="">todas as pessoas</option>${opt(D.pessoas, filtro.pessoa)}</select>
      <select id="fNat"><option value="">fixa / variável / parcelada</option>${Object.entries(NATUREZA).map(([k, v]) => `<option value="${k}" ${filtro.nat === k ? "selected" : ""}>${v}</option>`).join("")}</select>
      <label><input type="checkbox" id="fSoMes" ${filtro.soMes ? "checked" : ""}> só este mês</label>
      <label><input type="checkbox" id="fSoRevisar" ${filtro.soRevisar ? "checked" : ""}> a revisar</label>
      <label><input type="checkbox" id="fSoTerceiros" ${filtro.soTerceiros ? "checked" : ""}> para terceiros${filtro.terceiro ? " (" + esc(filtro.terceiro) + ")" : ""}</label>
    </div>
    ${lista.length ? grupos.map((g) => `
      <div style="display:flex;align-items:center;gap:8px;margin:14px 0 4px;color:var(--text-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${g.c ? `<span class="dot" style="background:${corConta(g.c)}"></span>${esc(g.c.nome)}` : "Sem conta"}<span style="margin-left:auto">${R$(soma(g.itens.filter((x) => x.l.tipo === "despesa"), (x) => x.l.valor))}</span></div>
      <div class="lista">${g.itens.map(({ l, n }) => { const cat = categoria(l.categoriaId); return `
        <div class="item clicavel" data-acao="editar" data-id="${l.id}">
          <div class="avatar" style="background:${l.tipo === "receita" ? "var(--receita)" : l.tipo === "investimento" ? "var(--invest)" : (cat?.cor || "#8a8a8a")}">${l.tipo === "receita" ? "+" : l.tipo === "investimento" ? "★" : esc(iniciais(cat?.nome || "?"))}</div>
          <div class="txt"><div class="tit">${esc(l.descricao)} ${l.revisar ? '<span class="pill rev">revisar</span>' : ""}</div>
            <div class="meta">${l.terceiro ? `<strong style="color:var(--warn)">para ${esc(l.terceiro)}</strong> · ` : ""}${cat ? esc(cat.nome) : l.tipo}${l.pessoa && l.pessoa !== D.pessoas[0] ? " · " + esc(l.pessoa) : ""}${l.data ? " · compra " + l.data.split("-").reverse().join("/") : ""}${conta(l.contaId)?.porCompra && l.data ? " · vence dia " + diaVenc(l, conta(l.contaId)) : ""}${l.obs ? " · " + esc(l.obs) : ""}</div></div>
          <div class="dir"><div class="val ${l.tipo === "receita" ? "pos" : ""}">${l.tipo === "receita" ? "+" : ""}${R$(l.valor)}</div>
            <span class="pill ${l.parcelas > 1 ? "ok" : ""}">${l.parcelas > 1 ? `${n ?? "—"}/${l.parcelas} · até ${mesCurto(mesUltimaParcela(l))}` : l.parcelas === 1 ? "à vista" : `mensal${l.mesFim ? " até " + mesCurto(l.mesFim) : ""}`}</span>
            ${l.terceiro && n !== undefined ? `<button class="btn mini ${recebidoNoMes(l, mesAtual) ? "" : "primario"}" data-acao="toggleRecebido" data-id="${l.id}" style="margin-top:4px">${recebidoNoMes(l, mesAtual) ? "✓ recebido" : "receber"}</button>` : ""}</div>
        </div>`; }).join("")}</div>`).join("") + `<div style="display:flex;justify-content:space-between;padding:14px 4px 0;font-weight:700;border-top:2px solid var(--border);margin-top:10px"><span>Total de despesas listadas</span><span>${R$(tot)}</span></div>` : `<div class="vazio">Nenhum lançamento com esses filtros.</div>`}
  </div>`;
}

let PROJ_CARTAO = null;
function renderProjecao() {
  const meses = Array.from({ length: 12 }, (_, i) => somaMes(mesAtual, i));
  const linhas = meses.map((m) => ({ m, t: totaisMes(m) }));
  let acum = Number(D.saldos?.[mesAtual] || 0);
  for (const r of linhas) { acum += r.t.tr - r.t.td - r.t.ti; r.acum = acum; }
  const max = Math.max(1, ...linhas.map((r) => Math.max(r.t.tr, r.t.td)));
  const porConta = D.contas.filter((c) => c.tipo === "cartao" || c.tipo === "financiamento").map((c) => ({ c, vals: meses.map((m) => soma(itensDoMes(m, "despesa").filter((x) => x.l.contaId === c.id), (x) => x.l.valor)) })).filter((x) => x.vals.some((v) => v > 0));
  return `
  <div class="card">
    <h2>Próximos 12 meses</h2>
    <div class="legenda"><span><span class="dot" style="background:var(--receita)"></span>Receitas</span><span><span class="dot" style="background:var(--despesa)"></span>Despesas</span></div>
    <div class="proj">${linhas.map((r) => `<div class="col" data-tip="${esc(mesCurto(r.m))}: receitas ${R$(r.t.tr)} · despesas ${R$(r.t.td)} · resultado ${R$(r.t.resultado)}"><i style="height:${(r.t.tr / max) * 100}%;background:var(--receita)"></i><i style="height:${(r.t.td / max) * 100}%;background:var(--despesa)"></i></div>`).join("")}</div>
    <div class="proj-x">${linhas.map((r) => `<span><span class="ocultar-m">${mesCurto(r.m)}</span><span class="so-m">${MESES[Number(r.m.split("-")[1]) - 1]}</span></span>`).join("")}</div>
    <div class="so-m" style="margin-top:12px"><div class="lista">${linhas.map((r) => { const res = r.t.resultado - r.t.ti; return `<div class="item clicavel" data-acao="irMes" data-mes="${r.m}">
      <div class="txt"><div class="tit">${mesLongo(r.m)}</div><div class="meta" style="white-space:normal">receitas ${R$(r.t.tr)} · despesas ${R$(r.t.td)} · parcelas ${R$(r.t.parcelas)}</div></div>
      <div class="dir"><div class="val ${res < 0 ? "neg" : "pos"}">${R$(res)}</div><div class="pequeno ${r.acum < 0 ? "neg" : ""}">acum. ${R$(r.acum)}</div></div></div>`; }).join("")}</div></div>
    <table style="margin-top:14px" class="ocultar-m">
      <thead><tr><th>Mês</th><th class="num">Receitas</th><th class="num ocultar-m">Fixas</th><th class="num ocultar-m">Variáveis</th><th class="num">Parcelas</th><th class="num">Despesas</th><th class="num ocultar-m">Aportes</th><th class="num">Resultado</th><th class="num">Acumulado</th></tr></thead>
      <tbody>${linhas.map((r) => `<tr class="clicavel" data-acao="irMes" data-mes="${r.m}"><td>${mesCurto(r.m)}</td><td class="num">${R$(r.t.tr)}</td><td class="num ocultar-m">${R$(r.t.fixas)}</td><td class="num ocultar-m">${R$(r.t.variaveis)}</td><td class="num">${R$(r.t.parcelas)}</td><td class="num">${R$(r.t.td)}</td><td class="num ocultar-m">${R$(r.t.ti)}</td><td class="num ${r.t.resultado - r.t.ti < 0 ? "neg" : "pos"}">${R$(r.t.resultado - r.t.ti)}</td><td class="num ${r.acum < 0 ? "neg" : ""}">${R$(r.acum)}</td></tr>`).join("")}</tbody>
    </table>
    <p class="pequeno">Fixas e receitas mensais se repetem; parcelas somem quando terminam. Variáveis só existem no mês lançado, então meses futuros parecem mais folgados do que serão: use o orçamento por categoria como referência.</p>
  </div>
  <div class="card">
    <h2>Fatura prevista por cartão</h2>
    ${porConta.length ? `<div class="so-m">

// ============ formulários ============
function abrir(html, onSubmit) {
  const dlg = $("#dlg");
  dlg.className = "";
  dlg.innerHTML = `<form method="dialog">${html}</form>`;
  const form = $("form", dlg);
  form.addEventListener("submit", (e) => { if (e.submitter?.value === "cancelar") return; e.preventDefault(); if (onSubmit(form) !== false) dlg.close(); });
  dlg.onclick = (e) => { if (e.target === dlg) dlg.close(); }; // tocar fora fecha
  dlg.showModal();
  return form;
}
const opts = (arr, val, idKey, nomeKey) => arr.map((x) => `<option value="${esc(idKey ? x[idKey] : x)}" ${(idKey ? x[idKey] : x) === val ? "selected" : ""}>${esc(nomeKey ? x[nomeKey] : x)}</option>`).join("");
const optsCat = (val) => [...new Set(D.categorias.map((c) => c.grupo || "Outros"))].map((g) => `<optgroup label="${esc(g)}">${opts(D.categorias.filter((c) => (c.grupo || "Outros") === g), val, "id", "nome")}</optgroup>`).join("");
function novoLancamento(tipo) {
  return { tipo, descricao: "", valor: "", parcelas: tipo === "despesa" ? 1 : 0, parcelaInicial: 1, mesInicio: mesAtual, mesFim: null, data: "",
    contaId: (tipo === "receita" ? D.contas.find((c) => c.tipo === "conta") : D.contas.find((c) => c.tipo === "cartao"))?.id || D.contas[0]?.id,
    categoriaId: tipo === "investimento" ? "investimento" : (categoria("alimentacao") ? "alimentacao" : D.categorias[0]?.id), pessoa: D.pessoas[0], obs: "" };
}
function formLancamento(l) {
  const novo = !l?.id;
  l = l || novoLancamento("despesa");
  const modo = !l.parcelas ? "mensal" : l.parcelas > 1 ? "parcelado" : "avista";
  const titulo = { despesa: "despesa", receita: "receita", investimento: "aporte" }[l.tipo];
  const form = abrir(`
    <h3>${novo ? "Nova" : "Editar"} ${titulo}</h3>
    <div class="campo"><label>Descrição</label><input name="descricao" required autofocus value="${esc(l.descricao)}" placeholder="ex.: Mercado, Escola do Miguel, Geladeira Bemol"></div>
    <div class="campo"><div class="seg" id="seg">${[["avista", "À vista"], ["parcelado", "Parcelado"], ["mensal", "Todo mês"]].map(([k, v]) => `<button type="button" data-modo="${k}" class="${modo === k ? "ativo" : ""}">${v}</button>`).join("")}</div><input type="hidden" name="modo" value="${modo}"></div>
    <div class="linha3">
      <div class="campo"><label id="lblValor">Valor (R$)</label><input name="valor" type="number" step="0.01" min="0" inputmode="decimal" required value="${l.valor}"></div>
      <div class="campo" data-so="parcelado"><label>Nº de parcelas</label><input name="parcelas" type="number" min="2" max="120" inputmode="numeric" value="${l.parcelas > 1 ? l.parcelas : 12}"></div>
      <div class="campo" data-so="parcelado"><label>Parcela atual</label><input name="parcelaInicial" type="number" min="1" inputmode="numeric" value="${l.parcelaInicial || 1}"></div>
    </div>
    <div class="campo" data-so="parcelado"><label class="chk"><input type="checkbox" name="valorTotal"> O valor digitado é o TOTAL da compra (dividir pelas parcelas)</label></div>
    <div class="linha">
      <div class="campo"><label>${l.tipo === "receita" ? "Conta que recebe" : "Cartão / conta"}</label><select name="contaId">${opts(D.contas, l.contaId, "id", "nome")}</select></div>
      <div class="campo"><label>Pessoa</label><select name="pessoa">${opts(D.pessoas, l.pessoa)}</select></div>
    </div>
    ${l.tipo === "despesa" ? `<div class="campo"><label>Categoria</label><select name="categoriaId">${optsCat(l.categoriaId)}</select></div>
    <div class="campo"><label>Comprado para terceiro? (quem vai te devolver)</label><input name="terceiro" list="terceiros" value="${esc(l.terceiro || "")}" placeholder="deixe vazio se a compra é sua"><datalist id="terceiros">${terceirosLista().map((x) => `<option value="${esc(x)}">`).join("")}</datalist></div>` : ""}
    <div class="linha">
      <div class="campo" data-nao="mensal"><label id="lblData">Data da compra (opcional)</label><input name="data" type="date" value="${l.data || ""}"></div>
      <div class="campo"><label id="lblInicio">Mês da fatura</label><input name="mesInicio" type="month" required value="${l.mesInicio}"><div class="pequeno" id="dicaFatura"></div></div>
      <div class="campo" data-so="mensal"><label>Até (opcional)</label><input name="mesFim" type="month" value="${l.mesFim || ""}"></div>
    </div>
    <div class="campo"><label>Observação</label><input name="obs" value="${esc(l.obs || "")}"></div>
    <div class="rodape-form">
      ${!novo ? `<button type="button" class="btn perigo esq" data-acao="excluirNoForm" data-id="${l.id}">Excluir</button>` : ""}
      <button class="btn" value="cancelar" formnovalidate>Cancelar</button><button class="btn primario" type="submit">Salvar</button>
    </div>`, (f) => {
      const fd = Object.fromEntries(new FormData(f)), modo = fd.modo;
      let valor = Number(fd.valor);
      const parcelas = modo === "mensal" ? 0 : modo === "parcelado" ? Math.max(2, Number(fd.parcelas) || 2) : 1;
      if (modo === "parcelado" && fd.valorTotal) valor = Math.round((valor / parcelas) * 100) / 100;
      const obj = { id: l.id || uid(), tipo: l.tipo, descricao: fd.descricao.trim(), valor, parcelas,
        parcelaInicial: modo === "parcelado" ? Math.min(parcelas, Math.max(1, Number(fd.parcelaInicial) || 1)) : 1,
        mesInicio: fd.mesInicio, mesFim: modo === "mensal" && fd.mesFim ? fd.mesFim : null, data: modo === "mensal" ? "" : (fd.data || ""),
        contaId: fd.contaId, categoriaId: l.tipo === "despesa" ? fd.categoriaId : (l.tipo === "investimento" ? "investimento" : null), pessoa: fd.pessoa, obs: fd.obs.trim(), revisar: false,
        terceiro: (fd.terceiro || "").trim() || null, recebidos: l.recebidos || {}, pagos: l.pagos || {} };
      for (const k of ["fitid", "descOrig", "origem", "comprovanteId"]) if (l[k]) obj[k] = l[k];
      if (l._pagoComprovante && obj.tipo === "despesa") obj.pagos = { [obj.mesInicio]: obj.data || new Date().toISOString().slice(0, 10) };
      if (conta(obj.contaId)?.porCompra && obj.parcelas && !obj.data) { avisar("Neste cartão a data da compra é obrigatória: ela define o vencimento."); return false; }
      if (!obj.valor || obj.valor <= 0) { avisar("Informe um valor maior que zero."); return false; }
      const i = D.lancamentos.findIndex((x) => x.id === obj.id);
      if (i >= 0) D.lancamentos[i] = obj; else D.lancamentos.push(obj);
      mudou();
    });
  const atualizaModo = () => {
    const m = $("[name=modo]", form).value;

function sugerirCategoria(desc) {
  const k = chaveImport(desc);
  if (k && D.regrasImport[k] && categoria(D.regrasImport[k])) return D.regrasImport[k];
  if (k.length >= 5) for (const [ck, id] of Object.entries(D.regrasImport)) if (ck.length >= 5 && categoria(id) && (k.startsWith(ck) || ck.startsWith(k))) return id;
  if (k) { const igual = D.lancamentos.find((l) => l.tipo === "despesa" && l.categoriaId && categoria(l.categoriaId) && chaveImport(l.descricao) === k); if (igual) return igual.categoriaId; }

  const acha = (c) => D.categorias.find((x) => semAcento(x.nome).toLowerCase().includes(c)) || D.categorias.find((x) => semAcento(x.grupo || "").toLowerCase().includes(c));
  for (const [re, cands] of PALAVRAS_CAT) if (re.test(s)) for (const c of cands) { const cat = acha(c); if (cat) return cat.id; }

function parseData(s) {

  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return ok(m[1], Number(m[2]), Number(m[3]));
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return ok(m[1], Number(m[2]), Number(m[3]));
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))) { const a = m[3].length === 2 ? "20" + m[3] : m[3]; return ok(a, Number(m[2]), Number(m[1])); }
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})$/))) return ok(mesAtual.split("-")[0], Number(m[2]), Number(m[1]));

function parseValor(s) {
  if (typeof s === "number") return isFinite(s) ? s : null;
  let t = String(s || "").trim(); if (!t) return null;
  let neg = false;

function csvLinhas(txt) {
  const linhas = txt.replace(/\r\n?/g, "\n").split("\n").filter((l) => l.trim());

  const amostra = linhas.slice(0, 8);

  const delim = conta(";") >= amostra.length - 1 ? ";" : conta("\t") >= amostra.length - 1 ? "\t" : ",";

    for (let i = 0; i < l.length; i++) { const ch = l[i]; if (q) { if (ch === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; } else if (ch === '"') q = true; else if (ch === delim) { cells.push(cur); cur = ""; } else cur += ch; }

  const head = rows[0].map(norm), find = (re) => head.findIndex((h) => re.test(h));
  let iData = find(/^data|^date|^dt\b|data mov|^dia$/), iDesc = find(/descri|title|memo|hist|lancamento|estabelecimento|^nome|^name|detalhe|transacao/), iVal = find(/^valor|^amount|^value|^vlr|^montante|^quantia/);
  let iDC = find(/^d\/c$|deb.?\/.?cred|^tipo$|natureza|^c\/d$/), iCred = find(/cred/), iDeb = find(/deb/);
  if (iCred === iDC) iCred = -1; if (iDeb === iDC) iDeb = -1;

    iData = r.findIndex((c) => parseData(c)); iDC = -1; iCred = -1; iDeb = -1;

async function lancarComprovante(r) {

  if (parecido && !(await confirmar(`Já existe "${parecido.descricao}" de ${R$(parecido.valor)} em ${data.split("-").reverse().join("/")}. Lançar mesmo assim?`))) return;
  const l = novoLancamento(tipo);
  const contaCorrente = D.contas.find((c) => c.tipo === "conta"), contaBoleto = D.contas.find((c) => c.tipo === "boleto");
  l.contaId = ((r.forma === "Boleto" || r.forma === "Débito automático") && contaBoleto ? contaBoleto : contaCorrente || D.contas[0] || {}).id;
  l.descricao = [r.nome, r.forma].filter(Boolean).join(" · ") || (r.receita ? "Recebimento" : "Pagamento");
  l.valor = r.valor; l.parcelas = 1; l.data = data;
  l.mesInicio = mesFatura(conta(l.contaId), data) || data.slice(0, 7);
  if (tipo === "despesa") l.categoriaId = sugerirCategoria(r.nome || r.forma);
  l.obs = ["comprovante", r.forma, r.id ? "ID " + r.id : ""].filter(Boolean).join(" · ");
  if (r.id) l.comprovanteId = r.id;
  l.origem = "comprovante";
  l._pagoComprovante = tipo === "despesa"; // o comprovante prova que já saiu da conta: o item nasce pago
  formLancamento(l);
}

// ============ comprovante em foto ou PDF: lido NESTE aparelho (leitor baixado só na 1ª vez) ============
const LIB = {
  tess: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
  tessWorker: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
  tessCore: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",
  tessLang: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/por@1.0.0/4.0.0_best_int",
  pdf: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
  pdfWorker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js",
};
function carregarScript(src) {
  return new Promise((ok, erro) => {
    if (document.querySelector(`script[data-lib="${src}"]`)?.dataset.ok) return ok();
    const s = document.createElement("script"); s.src = src; s.dataset.lib = src;
    s.onload = () => { s.dataset.ok = "1"; ok(); }; s.onerror = () => { s.remove(); erro(new Error("sem internet para baixar o leitor")); };
    document.head.appendChild(s);
  });
}
let OCR_WORKER = null, OCR_PROG = null;
async function imagemParaCanvas(f) {
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error("formato de imagem que este navegador não abre")); i.src = url; });
    const k = Math.min(1, 2200 / Math.max(img.naturalWidth, img.naturalHeight)); // foto de 12 MP fica lenta: reduz o lado maior
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
    return cv;
  } finally { URL.revokeObjectURL(url); }
}
async function ocrImagem(fonte) {
  await carregarScript(LIB.tess);
  if (!OCR_WORKER) OCR_WORKER = await Tesseract.createWorker("por", 1, { workerPath: LIB.tessWorker, corePath: LIB.tessCore, langPath: LIB.tessLang, logger: (m) => OCR_PROG && OCR_PROG(m) });
  const { data } = await OCR_WORKER.recognize(fonte);
  return data.text || "";
}
async function textoDoPdf(f) {
  await carregarScript(LIB.pdf);
  pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
  let txt = "";
  for (let p = 1; p <= Math.min(pdf.numPages, 3); p++) {
    const c = await (await pdf.getPage(p)).getTextContent();
    let y0 = null, linha = [];
    const fecha = () => { if (linha.length) txt += linha.join(" ") + "\n"; linha = []; };
    for (const it of c.items) {
      const y = Math.round(it.transform[5]);
      if (y0 !== null && Math.abs(y - y0) > 2) fecha(); // mudou de linha na página
      y0 = y; if (it.str.trim()) linha.push(it.str.trim());
      if (it.hasEOL) { fecha(); y0 = null; }
    }
    fecha();
  }
  if (txt.replace(/\s/g, "").length >= 20) return txt;
  // PDF escaneado (sem texto): desenha a 1ª página e lê como imagem
  const pg = await pdf.getPage(1), vp = pg.getViewport({ scale: 2 }), cv = document.createElement("canvas");
  cv.width = vp.width; cv.height = vp.height;
  await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
  return ocrImagem(cv);
}
async function lerArquivoComprovante(f) {
  if ($("#dlg").open) $("#dlg").close();
  const ehPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  const d = dialogo2(`<form method="dialog"><h3>Lendo o comprovante…</h3><p class="pequeno" id="ocrMsg">${ehPdf ? "Na primeira vez o app baixa o leitor de PDF (cerca de 1,4 MB)." : "Na primeira vez o app baixa o leitor de imagem (cerca de 5,5 MB); depois fica mais rápido."} O arquivo é lido neste aparelho e não sai dele.</p><div class="barra" style="margin-top:12px"><i id="ocrBarra" style="width:4%;background:var(--accent-2)"></i></div></form>`);
  d.onclose = null;
  const NOMES = { "loading tesseract core": "baixando o leitor…", "initializing tesseract": "preparando…", "loading language traineddata": "baixando o português…", "initializing api": "preparando…", "recognizing text": "lendo o texto…" };
  OCR_PROG = (m) => { const b = $("#ocrBarra"), t = $("#ocrMsg"); if (b && typeof m.progress === "number") b.style.width = Math.max(4, Math.round(m.progress * 100)) + "%"; if (t && NOMES[m.status]) t.textContent = NOMES[m.status]; };
  try {
    const txt = ehPdf ? await textoDoPdf(f) : await ocrImagem(await imagemParaCanvas(f));
    if (d.open) d.close();
    if (!txt.trim()) return avisar("Não consegui ler texto nesse arquivo. Tente um print mais nítido.");
    colarComprovante(txt);
    if (!lerTextoComprovante(txt).valor) avisar("Li o texto, mas não achei o valor. Confira o texto e corrija se precisar.");
  } catch (e) { if (d.open) d.close(); avisar("Não consegui ler: " + (e.message || e) + ". Dá para copiar o texto do comprovante e usar Colar."); }
  finally { OCR_PROG = null; }
}

// ============ lançamento vindo da Lívia: link #lanc=… ou código FINANCAS-LANC … ============
// JSON {v:1, tipo:"despesa"|"receita", valor, data:"AAAA-MM-DD", nome, forma, id} em base64url (UTF-8, sem padding)
function decodificarLanc(b64) {
  const s = String(b64).replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "===".slice((s.length + 3) % 4));
  const j = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
  const valor = Math.round(Math.abs(Number(j.valor)) * 100) / 100, data = parseData(j.data);
  if (!(valor > 0)) throw new Error("sem valor");
  return { valor, data, nome: String(j.nome || "").slice(0, 80), forma: String(j.forma || "").slice(0, 30), id: String(j.id || "").slice(0, 60), receita: j.tipo === "receita", daLivia: true };
}
const RE_CODIGO_LANC = /FINANCAS-LANC[\s:]+([A-Za-z0-9_-]{12,})/;
function lerTextoComprovante(txt) {
  const m = String(txt || "").match(RE_CODIGO_LANC);
  if (m) { try { return decodificarLanc(m[1]); } catch (e) { /* código quebrado: tenta ler como comprovante */ } }
  return lerComprovante(txt);
}
function abrirLinkLancamento() {
  const m = location.hash.match(/[#&]lanc=([A-Za-z0-9_-]+)/); if (!m) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} // tira os dados do endereço
  let r; try { r = decodificarLanc(m[1]); } catch (e) { return avisar("Link de lançamento inválido."); }
  // iPhone: o link do WhatsApp abre no Safari, que tem memória separada do app da tela de início
  if (navigator.standalone === false || !D.contas.length) {
    const codigo = "FINANCAS-LANC " + m[1];
    const d = dialogo2(`<form method="dialog"><h3>Levar para o app</h3>
      <p class="pequeno">${esc([r.nome, r.forma].filter(Boolean).join(" · ") || "Lançamento")} · <b>${R$(r.valor)}</b>${r.data ? " · " + r.data.split("-").reverse().join("/") : ""}</p>
      <p class="pequeno">Este link abriu no Safari, que não enxerga os dados do app instalado na tela de início. Toque em <b>Copiar</b>, abra o app Finanças e use <b>Comprovante › colar da área de transferência</b>.</p>
      <div class="rodape-form">${D.contas.length ? `<button type="button" class="btn" data-aqui>Lançar aqui mesmo</button>` : ""}<button type="button" class="btn primario" data-copiar>Copiar</button></div></form>`);
    $("[data-copiar]", d).onclick = async () => { try { await navigator.clipboard.writeText(codigo); avisar("Copiado. Agora abra o app Finanças."); d.close(); } catch (e) { const ta = document.createElement("textarea"); ta.className = "copia"; ta.value = codigo; d.querySelector("form").appendChild(ta); ta.select(); avisar("Selecione e copie o código."); } };
    const aqui = $("[data-aqui]", d); if (aqui) aqui.onclick = () => { d.close(); lancarComprovante(r); };
    return;
  }
  lancarComprovante(r);
}
